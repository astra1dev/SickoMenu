name: Build Project

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    #branches: [ "main" ]
  
jobs:
  Build_Release_x86:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      
      - name: Build Release
        shell: bash
        run: MSBuild.exe -property:Configuration=Release -property:PlatformToolset=v143 -property:Platform=x86
        
      - name: Build Release_Version
        shell: bash
        run: MSBuild.exe -property:Configuration=Release_Version -property:PlatformToolset=v143 -property:Platform=x86
        
      - name: Package Release Builds
        shell: cmd
        run: |
          move /y Release\SickoMenu.dll SickoMenu.dll
          move /y Release_Version\version.dll version.dll
          tar -caf Release_x86_SteamItch.zip SickoMenu.dll version.dll LICENSE
        
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release_x86_SteamItch
          path: Release_x86_SteamItch.zip
          
  Build_Release_x64:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      
      - name: Build Release
        shell: bash
        run: MSBuild.exe -property:Configuration=Release -property:PlatformToolset=v143 -property:Platform=x64
        
      - name: Build Release_Version
        shell: bash
        run: MSBuild.exe -property:Configuration=Release_Version -property:PlatformToolset=v143 -property:Platform=x64
        
      - name: Package Release Builds
        shell: cmd
        run: |
          move /y x64\Release\SickoMenu.dll SickoMenu.dll
          move /y x64\Release_Version\version.dll version.dll
          tar -caf Release_x64_EpicXboxMS.zip SickoMenu.dll version.dll LICENSE
        
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release_x64_EpicXboxMS
          path: Release_x64_EpicXboxMS.zip
          
  Build_Debug_x86:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      
      - name: Build Debug
        shell: bash
        run: MSBuild.exe -property:Configuration=Debug -property:PlatformToolset=v143 -property:Platform=x86
        
      - name: Build Debug_Version
        shell: bash
        run: MSBuild.exe -property:Configuration=Debug_Version -property:PlatformToolset=v143 -property:Platform=x86
        
      - name: Package Debug Builds
        shell: cmd
        run: |
          move /y Debug\SickoMenu.dll SickoMenu.dll
          move /y Debug_Version\version.dll version.dll
          tar -caf Debug_x86_SteamItch.zip SickoMenu.dll version.dll LICENSE
        
      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Debug_x86_SteamItch
          path: Debug_x86_SteamItch.zip
          
  Build_Debug_x64:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      
      - name: Build Debug
        shell: bash
        run: MSBuild.exe -property:Configuration=Debug -property:PlatformToolset=v143 -property:Platform=x64
        
      - name: Build Debug_Version
        shell: bash
        run: MSBuild.exe -property:Configuration=Debug_Version -property:PlatformToolset=v143 -property:Platform=x64
        
      - name: Package Debug Builds
        shell: cmd
        run: |
          move /y x64\Debug\SickoMenu.dll SickoMenu.dll
          move /y x64\Debug_Version\version.dll version.dll
          tar -caf Debug_x64_EpicXboxMS.zip SickoMenu.dll version.dll LICENSE
        
      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Debug_x64_EpicXboxMS
          path: Debug_x64_EpicXboxMS.zip
          
  AutoRelease:
    runs-on: windows-2025
    needs: [Build_Release_x86, Build_Release_x64, Build_Debug_x86, Build_Debug_x64]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
      
      - name: Automatic Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          prerelease: false
          generate_release_notes: true
          files: |
            Release_x86_SteamItch/Release_x86_SteamItch.zip
            Release_x64_EpicXboxMS/Release_x64_EpicXboxMS.zip
            Debug_x86_SteamItch/Debug_x86_SteamItch.zip
            Debug_x64_EpicXboxMS/Debug_x64_EpicXboxMS.zip
